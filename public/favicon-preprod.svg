<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b0e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f05;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffb800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc6600;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#4a3728" stroke-width="8"/>
  <!-- Text "WWII" -->
  <text x="256" y="310" font-family="monospace, monospace" font-size="180" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="8">WWII</text>
  <!-- Subtitle "WOD WEB" -->
  <text x="256" y="380" font-family="monospace, monospace" font-size="36" font-weight="600" fill="#e8c56d" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">WOD WEB</text>
  <!-- Preprod badge -->
  <rect x="350" y="40" width="120" height="40" rx="8" fill="#ffb800" fill-opacity="0.2" stroke="#ffb800" stroke-width="2"/>
  <text x="410" y="68" font-family="monospace, monospace" font-size="20" font-weight="bold" fill="#ffb800" text-anchor="middle" dominant-baseline="middle">PRE</text>
  <!-- Accent line -->
  <line x1="156" y1="330" x2="356" y2="330" stroke="#ffb800" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>